name: Run Download Scripts

on:
  workflow_dispatch: # Adds a manual "Run workflow" button on GitHub

permissions:
  contents: write # Allows GitHub Actions to push the downloaded files to your repo

jobs:
  run-py-downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true # Keep if using Git LFS for files > 100MB

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install huggingface_hub
          fi

      - name: Run Python download scripts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python code/scripts/download_data.py
          python code/scripts/download_models.py

      - name: Commit and push downloaded assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add .
          git commit -m "Add downloaded datasets and models" || exit 0
          git push
